[package]
name = "local-ai-agent-runtime"
version = "0.1.0"
edition = "2021"
description = "Rust V2 Agent runtime for Local AI Desktop"

[lib]
name = "local_ai_agent_runtime"
path = "src/lib.rs"

[[bin]]
name = "local-ai-agent-runtime"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = "warn"
pedantic = "warn"
